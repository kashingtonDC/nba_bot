name: nba-bot cron

# Schedule: every 15 minutes during the playoffs.
#
# Note: GitHub Actions docs warn that scheduled events can be delayed during
# periods of high GitHub load (especially on the hour) and may be skipped.
# 15-minute cadence is well above the 5-minute floor for reliability.
#
# Manual trigger is also enabled — useful for testing without waiting for
# the next scheduled run.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Prevent overlapping runs. The bot finishes in ~5 seconds so this is mostly
# defensive, but it's free safety against weird scenarios.
concurrency:
  group: nba-bot-cron
  cancel-in-progress: false

# We need write access to commit docs/outcomes.json back to main.
# Default GITHUB_TOKEN has read-only contents on scheduled runs.
permissions:
  contents: write

jobs:
  log-market-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Off-season guard
        # Hard cutoff at July 1 of the current year. Once the NBA Finals end
        # (typically mid-June), there's nothing for the bot to predict — and
        # we don't want to burn GitHub Actions minutes during the off-season.
        # Edit the CUTOFF below to extend the playoff window for next season.
        run: |
          CUTOFF="2026-07-01"
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "$CUTOFF" ]]; then
            echo "::notice::Past cutoff date $CUTOFF (today: $TODAY). Exiting cleanly."
            echo "To extend, edit the CUTOFF in .github/workflows/bot.yml"
            exit 0
          fi
          echo "Inside playoff window (today $TODAY, cutoff $CUTOFF)"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh series state from ESPN
        # If ESPN hiccups, don't fail the workflow. bot.py will fall back to
        # whatever series_state.json contains — or to hardcoded defaults if
        # the file doesn't exist. continue-on-error means a flaky ESPN call
        # is logged as a warning rather than killing the run.
        run: python scripts/refresh_series.py
        continue-on-error: true

      - name: Run the bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python bot.py

      - name: Generate outcomes.json for dashboard
        # Derives docs/outcomes.json from series_state.json. The dashboard
        # reads this file to show correct final scores for series that
        # ended after we stopped logging them in Supabase.
        run: python scripts/generate_outcomes.py
        continue-on-error: true

      - name: Commit outcomes.json if changed
        # Only commit if the file actually changed. This prevents empty
        # commits cluttering the git log when the cron runs but no series
        # state changed (which is most of the time).
        run: |
          git config user.name "nba-bot"
          git config user.email "actions@github.com"
          git add docs/outcomes.json
          if git diff --staged --quiet; then
            echo "No changes to outcomes.json; skipping commit."
          else
            git commit -m "data: refresh outcomes.json [skip ci]"
            git push
          fi
