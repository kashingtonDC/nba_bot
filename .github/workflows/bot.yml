name: nba-bot cron

# Schedule: every 15 minutes during the playoffs.
#
# Note: GitHub Actions docs warn that scheduled events can be delayed during
# periods of high GitHub load (especially on the hour) and may be skipped.
# 15-minute cadence is well above the 5-minute floor for reliability.
#
# Manual trigger is also enabled — useful for testing without waiting for
# the next scheduled run.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Prevent overlapping runs. The bot finishes in ~5 seconds so this is mostly
# defensive, but it's free safety against weird scenarios.
concurrency:
  group: nba-bot-cron
  cancel-in-progress: false

# We need write access to commit data files back to main.
# Default GITHUB_TOKEN has read-only contents on scheduled runs.
permissions:
  contents: write

jobs:
  log-market-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Off-season guard
        # Hard cutoff at July 1 of the current year. Once the NBA Finals end
        # (typically mid-June), there's nothing for the bot to predict — and
        # we don't want to burn GitHub Actions minutes during the off-season.
        # Edit the CUTOFF below to extend the playoff window for next season.
        run: |
          CUTOFF="2026-07-01"
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "$CUTOFF" ]]; then
            echo "::notice::Past cutoff date $CUTOFF (today: $TODAY). Exiting cleanly."
            echo "To extend, edit the CUTOFF in .github/workflows/bot.yml"
            exit 0
          fi
          echo "Inside playoff window (today $TODAY, cutoff $CUTOFF)"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh series state from ESPN
        # Updates series_state.json with current ESPN data. This file is
        # consumed by bot.py (via config._load_series) to know which series
        # are active and what their current scores are. CRITICAL that this
        # file is committed back to main so the next cron run sees fresh
        # state — see the commit step below.
        run: python scripts/refresh_series.py
        continue-on-error: true

      - name: Run the bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python bot.py

      - name: Generate outcomes.json for dashboard
        # Derives docs/outcomes.json from series_state.json. The dashboard
        # reads this file to show correct final scores for series that
        # ended after we stopped logging them in Supabase.
        run: python scripts/generate_outcomes.py
        continue-on-error: true

      - name: Commit data files if changed
        # Commit BOTH series_state.json AND docs/outcomes.json. Without
        # series_state.json being committed, the next cron run's checkout
        # gets a stale file, refresh_series.py rebuilds it from ESPN,
        # bot.py uses the fresh version for that one run only, and then
        # the freshness is thrown away on shutdown. Two-week stale file
        # symptoms include the Live tab showing series from the previous
        # round and zero conference-finals series being logged.
        #
        # generate_outcomes.py writes a deterministic outcomes.json (no
        # timestamps) so byte-identical content produces no commit.
        # series_state.json *does* have a fetched_at timestamp, so it will
        # always show a diff and always commit. That's fine — the commit
        # cost is low and having a fresh file on each cron is the goal.
        #
        # Push wrapped in pull-rebase + retry to handle races: multiple
        # cron ticks can land close enough that a naive push gets rejected
        # for non-fast-forward. We rebase on top of origin/main and retry
        # once. If the second push still fails, we exit non-zero so the
        # failure is visible in the Actions tab.
        run: |
          set -e
          git config user.name "nba-bot"
          git config user.email "actions@github.com"
          git add series_state.json docs/outcomes.json
          if git diff --staged --quiet; then
            echo "No changes to data files; skipping commit."
            exit 0
          fi
          git commit -m "data: refresh series_state + outcomes [skip ci]"

          # Try to push, retrying once after a rebase if the first push
          # is rejected (typical cause: a concurrent cron tick pushed first).
          if ! git push origin HEAD:main; then
            echo "Initial push rejected; rebasing on origin/main and retrying"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
